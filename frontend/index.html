<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Keep your movies, series, and anime together. Discover what to watch next, save titles to your library, and track your progress with Watchloom." />
    <link rel="icon" type="image/png" sizes="256x256" href="/images/watchloom-logo-256.png" />
    <link rel="shortcut icon" type="image/png" href="/images/watchloom-logo-256.png" />
    <link rel="apple-touch-icon" href="/images/watchloom-logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watchloom - Track Your Entertainment</title>
    <script>
      (() => {
        // Keep this default in sync with DEFAULT_THEME in src/store/themeStore.ts.
        let theme = 'light'
        try {
          const savedTheme = localStorage.getItem('watchloom-theme')
          if (savedTheme === 'light' || savedTheme === 'dark') {
            theme = savedTheme
          } else {
            const legacy = JSON.parse(localStorage.getItem('theme-storage') || 'null')
            if (legacy?.state?.theme === 'light' || legacy?.state?.theme === 'dark') {
              theme = legacy.state.theme
            }
          }
        } catch {
          // The app starts in light mode if browser storage is unavailable.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('light', theme === 'light')
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    
    <!-- Open connections early to the API and artwork hosts used on first paint. -->
    <link rel="preconnect" href="https://watchloom.onrender.com" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="dns-prefetch" href="https://s4.anilist.co">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
