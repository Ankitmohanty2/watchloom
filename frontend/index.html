<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="1254x1254" href="/images/watchloom-logo.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/images/watchloom-logo.png?v=2" />
    <link rel="apple-touch-icon" href="/images/watchloom-logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watchloom - Track Your Entertainment</title>
    <script>
      (() => {
        let theme = 'dark'
        try {
          const savedTheme = localStorage.getItem('watchloom-theme')
          if (savedTheme === 'light' || savedTheme === 'dark') {
            theme = savedTheme
          } else {
            const legacy = JSON.parse(localStorage.getItem('theme-storage') || 'null')
            if (legacy?.state?.theme === 'light' || legacy?.state?.theme === 'dark') {
              theme = legacy.state.theme
            }
          }
        } catch {
          // The app starts in dark mode if browser storage is unavailable.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('light', theme === 'light')
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
