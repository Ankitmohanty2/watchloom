# Production Docker Compose Configuration
services:
  mongodb:
    image: mongo:7.0
    container_name: entertainment_tracker_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: entertainment_tracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: entertainment_tracker_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/
      - DATABASE_NAME=entertainment_tracker
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - ANILIST_API_URL=https://graphql.anilist.co
      - FRONTEND_URL=${FRONTEND_URL}
      - COOKIE_SECURE=true
      - ENVIRONMENT=production
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: entertainment_tracker_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongodb_data:
    driver: local

networks:
  app-network:
    driver: bridge
